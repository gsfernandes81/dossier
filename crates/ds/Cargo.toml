[package]
name = "ds"
description = "The dossier v3 core: browse, search, open, status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ds"
path = "src/main.rs"

[dependencies]
# The store. Everything this crate shows is a fold of it.
journal = { path = "../journal" }
# The TUI. Ratatui re-exports the crossterm it was built against
# (`ratatui::crossterm`), so this is one dependency and not two — no version
# skew between backend and frontend.
ratatui = "0.30"
# Today's date, and the warn window's far edge. Everything else about dates is
# string comparison on ISO values, which is why this is the only date use in the
# crate.
#
# `tzdb-bundle-always` embeds the zone database in the binary: the phone build is
# a static musl binary running under Termux, which has no `/usr/share/zoneinfo`
# for a system lookup to find. Getting the zone wrong would move "expired" by a
# day near midnight, which is exactly the signal this app exists to give.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Search folds accents so `résumé` matches `resume`, which needs NFKD
# decomposition — the one thing std's `to_lowercase` cannot do.
unicode-normalization = "0.1"
# Terminal columns are not characters: a CJK document name is two cells per
# character.
unicode-width = "0.2"
# The per-device config file; the only TOML in v3, everything shared lives in
# the journal.
toml = "1"
# The same config location the Python app uses, so a configured device keeps
# working.
dirs = "6"
# Syncthing's REST API, status only. Blocking, tiny, and rustls rather than the
# system TLS stack — the phone binary is static musl, so there is no system
# stack to link against. `default-features = false` drops the platform
# certificate verifier for the same reason.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
