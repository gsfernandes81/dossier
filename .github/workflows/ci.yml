name: CI

on:
  push:
  pull_request:

# Least-privilege default token: the check job only reads the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check dossier

      - name: Format check (ruff)
        run: uv run ruff format --check dossier

      - name: Type check (ty)
        run: uv run ty check dossier

      - name: Test (pytest)
        run: uv run python -m pytest --cov=dossier --cov-report=term-missing
