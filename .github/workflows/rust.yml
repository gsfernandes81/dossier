# The v3 Rust workspace (REWRITE.md §10) — `crates/*`.
#
# Separate from `spike.yml` on purpose: that workflow guards a throwaway that
# gets deleted at the end of R0.2, while this one guards the code the rewrite is
# actually built from. Same shape, so the habits transfer.
name: rust

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rustfmt.toml"
      - "docs/dev/demo/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rustfmt.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint + format are platform-independent: once is enough.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (with fmt + clippy)
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      # Pedantic is denied, and its findings are triaged in place rather than
      # allowed wholesale (REWRITE.md §4.6). Unlike the spike, this crate handles
      # real user data, so the numeric-cast lints stay on.
      - name: Clippy (pedantic, denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Tests on both desktop platforms. Windows is a shipping target, and it is
  # where path and integer-width assumptions go to die.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Release, because the perf gate only asserts in release — a debug build
      # is an order of magnitude slower for reasons unrelated to the design.
      # `--nocapture` so the measured numbers land in the CI log as a record.
      - name: Test
        run: cargo test --workspace --release -- --nocapture

  # WSL: the Linux build on a Windows machine, with the store on the Windows
  # drive. The unit tests cover the translation on every platform; what only
  # this leg can say is whether the journal's file handling — the advisory
  # lock, the append handle, `set_len` on a torn tail, `sync_data`, and the
  # temp-plus-rename of a compaction while the append handle is still open —
  # behaves on drvfs — WSL 2's 9P share out of its VM, the filesystem the
  # store actually lives on. WSL 2 only: WSL 1 is not supported. `TMPDIR` is
  # pointed at the Windows drive so every test's temp directory lands there,
  # and `DS_EXPECT_WSL` arms the one test that checks detection and
  # translation against `wslpath` on a real WSL.
  #
  # Not mirrorable off Windows: the local gate cannot run this leg, so read its
  # conclusion rather than infer it from the Linux one.
  wsl:
    # Pinned, not `windows-latest`: WSL 2 needs the runner's nested
    # virtualization, and the image that has it is not something to inherit.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # A C compiler for `ring` (rustls, via the Syncthing check).
          additional-packages: build-essential curl ca-certificates

      # Inside the distribution, not the runner's Windows toolchain: this leg
      # is about the Linux binary. No rust-cache — it runs on the Windows side
      # and cannot see a target directory inside WSL.
      - name: Install Rust inside WSL
        shell: wsl-bash {0}
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      # The twin `ds init` and the writer must refuse: a Windows-side `ds.exe`
      # config naming the device `ci-twin`, where `%LOCALAPPDATA%` really is.
      - name: Plant a Windows-side ds config
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'dossier'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'config.toml') -Value 'device = "ci-twin"'

      # Debug, not release: the perf gates assert only in release, and this leg
      # is about I/O semantics, so the halved build time is free.
      - name: Test on the Windows drive
        shell: wsl-bash {0}
        run: |
          source "$HOME/.cargo/env"
          case "$PWD" in /mnt/*) ;; *) echo "not on drvfs: $PWD"; exit 1 ;; esac
          export CARGO_TARGET_DIR="$HOME/target"
          export TMPDIR="$PWD/../wsl-tmp"
          mkdir -p "$TMPDIR"
          export DS_EXPECT_WSL=1
          cargo test --workspace -- --nocapture

      # The binary as a person runs it: a root typed as Explorer shows it is
      # stored as its mount, the planted twin is refused, and an unanswered
      # Syncthing loopback explains WSL's NAT networking.
      - name: Smoke the binary
        shell: wsl-bash {0}
        run: |
          ds="$HOME/target/debug/ds"
          export DS_CONFIG_DIR="$PWD/../wsl-tmp/config"
          windows_root="$(wslpath -w "$PWD")"
          if "$ds" init --device ci-twin --root "$windows_root"; then
            echo "the Windows twin was not refused"; exit 1
          fi
          "$ds" init --device ci-wsl --root "$windows_root"
          grep -F "syncthing_root = \"$PWD\"" "$DS_CONFIG_DIR/config.toml"
          printf '\n[syncthing]\napikey = "k"\naddress = "https://127.0.0.1:1"\n' >> "$DS_CONFIG_DIR/config.toml"
          report="$("$ds" status)"
          echo "$report"
          grep -F "networkingMode=mirrored" <<<"$report"

  # The journal crate is pure logic, so this is quick — but it is also the crate
  # the phone's startup path depends on, and a cross-build that only ever runs
  # on a developer's machine is a cross-build that breaks in the week nobody
  # tried it.
  phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust + the Android/Termux target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-musl

      # Rust needs no toolchain for this target — but `ring` (via rustls, via
      # the Syncthing REST check) compiles C and assembly, and `cc` looks for an
      # `aarch64-linux-musl-gcc` that does not exist. clang cross-compiles by
      # construction; `.cargo/config.toml` points cc at it. Installed
      # explicitly rather than relied on from the image, so this leg does not
      # depend on what a runner happens to ship.
      - name: Install clang (the cross C compiler for ring)
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - uses: Swatinem/rust-cache@v2

      - name: Cross-build (static, aarch64 musl)
        run: cargo build --workspace --release --target aarch64-unknown-linux-musl

      # So the phone can be given a build without one being cross-compiled by
      # hand and handed over out of band. GitHub only shows a workflow's own
      # "Run workflow" button on the default branch, but artifacts are
      # per-run — `gh run download` works from any branch.
      - name: Stage the phone bundle
        run: |
          mkdir -p bundle
          cp target/aarch64-unknown-linux-musl/release/ds bundle/ds
          cp -r docs/dev/demo bundle/demo

      - uses: actions/upload-artifact@v4
        with:
          name: ds-phone
          path: bundle/
          if-no-files-found: error
