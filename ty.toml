# ty type-checker configuration.
#
# Prefer fixing types over suppressing them. When ty genuinely cannot model a pattern,
# add a per-file `[[overrides]]` block here with an explanatory comment and the specific
# rule set to "ignore" — never a bare inline `# type: ignore`. Example:
#
#   [[overrides]]
#   include = ["dossier/some_module.py"]
#   [overrides.rules]
#   unresolved-attribute = "ignore"  # <reason ty can't see it>

[[overrides]]
include = ["dossier/platform_open.py"]

[overrides.rules]
# os.startfile exists only on Windows; typeshed hides it on the Linux CI runner,
# so ty can't resolve it there. The call is guarded by a sys.platform check.
unresolved-attribute = "ignore"
