[workspace]
resolver = "2"
members = ["crates/journal", "crates/ds"]
# The spike has its own `[profile.release]` and CI; Cargo only honours profiles
# at a workspace root, so it stays outside the workspace.
exclude = ["spike"]

# Shared by every crate so a dependency bump happens in one place.
[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# What the real binary ships with, so measurements taken here transfer.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# The phone binary is copied to a device by hand and is static, so every
# megabyte is one the user waits for. Symbols are a debugger's, and a panic's
# backtrace on Termux is not how this app gets debugged — the journal is.
strip = true
