# This drop-in restores what this container did before it was built on gsrpi-dev-base.
#
# The old sshd_config.dev carried NO AllowTcpForwarding line, so OpenSSH's default — yes —
# applied, and an `ssh -L` from a laptop through this container worked. The base turns
# forwarding OFF, correctly for itself (infra-dev's sshd is a door and nothing else, and
# it holds keys to all three hosts), and a drop-in is how a child says its own case is
# different.
#
# So this line is a decision, not an oversight either way: the conversion is meant to
# change what this image is BUILT from and not what it does, and a silently narrowed sshd
# is the kind of change that surfaces weeks later as "Zed used to work".
AllowTcpForwarding yes
