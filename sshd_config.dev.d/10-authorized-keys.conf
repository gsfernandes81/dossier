# ds-dev's one sshd drop-in. gsrpi-dev-base includes /home/dev/sshd_config.d/*.conf from
# the TOP of its sshd_config, and sshd takes the first value it obtains for a keyword, so
# what is here overrides the base rather than merely following it.
#
# WHY THIS ONE LINE EXISTS. The base serves ~/.ssh/authorized_keys, which its entrypoint
# writes from the read-only secrets mount infra-dev has. This container has never worked
# that way: docker-compose.dev.yml bind-mounts the HOST account's .ssh directory read-only
# at ~/.host-ssh (DEV_SSH_AUTHORIZED_KEYS in .env), and sshd reads authorized_keys out of
# it — so the keys that already log into the host log into the container, and there is no
# second key list to keep in step. Zed's remote, and every `ssh -p 2223 dev@<host>`,
# arrive on that.
#
# The base's entrypoint reads this file's own text before deciding what to say about
# authorized_keys, so it does not claim "NOTHING can ssh in" about a file it is not
# serving. Keep the keyword at the start of the line for that reason.
AuthorizedKeysFile /home/dev/.host-ssh/authorized_keys
