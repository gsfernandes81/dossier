[project]
name = "dossier"
version = "0.1.0"
description = "Cross-platform TUI for tracking personal documents (physical + digital) on Windows and Termux"
authors = [{ name = "geolocatingshark", email = "geolocatingshark@gmail.com" }]
# Relaxed from destiny-director's `~=3.13.0` pin: dossier must also run under Termux,
# whose Python may trail the latest. 3.11+ is required for stdlib `tomllib`.
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = [
    "textual>=1.0.0",
    "rich>=13.0",  # progress bars for `ds import`; also a transitive Textual dep
    "platformdirs>=4.3",
    "python-dateutil>=2.9.0",
    # YAML front-matter read/write. The wheels for desktop platforms bundle libyaml
    # (so the fast C loader/dumper is automatic); on Termux `pkg install libyaml`
    # before syncing deps enables it, else it falls back to pure Python. See
    # dossier/store.py and the `ds profile` libyaml hint.
    "pyyaml>=6.0",
    "tomli-w>=1.1.0",
]

[project.optional-dependencies]
# `ds` dedup: rasterize scans and perceptual-hash their pages. Desktop-only;
# pure wheels, no system deps. `pip install 'dossier[dedup]'`.
dedup = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
]
# `ds scan` vision extraction: rasterize a scan and read it with a local VLM.
# Same rasterization stack as dedup; the VLM is reached over stdlib HTTP.
scan = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
]

[project.scripts]
dossier = "dossier.__main__:main"
ds = "dossier.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
    "pre-commit>=4.6.0",
]
# Dev-only, opt-in (not in default-groups, so plain `uv sync`/CI skips it): the
# real-terminal TUI driver in tools/. pyte is a pure-Python VT100 emulator;
# pywinpty gives a Windows ConPTY (POSIX uses the stdlib `pty`).
driver = [
    "pyte>=0.8.2",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.sdist]
include = ["dossier"]

[tool.hatch.build.targets.wheel]
include = ["dossier"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["dossier"]

[tool.coverage.run]
source = ["dossier"]
