# Remote dev environment for dossier. Bring up + log in to everything in one command:
#   make dev            (= make dev-up  +  make dev-login)
# then reach the container over the host's sshd:
#   ssh -t <host-user>@<host-ip> 'docker exec -it ds-dev fish'
# or drive it remotely from claude.ai/code — the entrypoint auto-starts
# `claude remote-control --spawn worktree` once you're signed in.
#
# dossier is a local, file-backed TUI: there is no database, no Railway deploy, and
# no data store mounted here on purpose (tests use tmp_path; real documents stay off
# the dev box). Only the repo clone is bind-mounted.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Build the container's `dev` user with the HOST user's uid/gid so the
        # bind-mounted /workspace (below) stays writable. Pass via `make dev-up`
        # (HOST_UID=$(stat -c '%u' .) HOST_GID=$(stat -c '%g' .)); defaults to 1000.
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: ds-dev
    container_name: ds-dev
    hostname: ${DEV_HOSTNAME:-ds-dev}   # Claude Code shows this as the machine title;
                                        # make dev-up sets it to <host-hostname>-ds-dev
    init: true
    volumes:
      - .:/workspace                          # bind-mount the host clone; dev user uid built to match (USER_UID)
      - ds-uv-cache:/home/dev/.cache/uv        # persist uv cache (fast re-syncs)
      - ds-claude:/home/dev/.claude            # persist Claude Code login/config (incl. ~/.claude.json via CLAUDE_CONFIG_DIR)
      - ds-gh:/home/dev/.config/gh             # persist `gh auth login` (hosts.yml/config.yml under GH_CONFIG_DIR)
      - ${DEV_SSH_AUTHORIZED_KEYS}:/home/dev/.host-ssh:ro   # host user's .ssh dir (from .env); sshd reads authorized_keys here
      - ds-ssh-host:/home/dev/.ssh-host        # persist sshd host key -> stable known_hosts
      - ds-zed-server:/home/dev/.zed_server    # persist Zed's remote server binary (no re-download per rebuild)
      - ds-local-share:/home/dev/.local/share  # persist fish history + bash history (HISTFILE points here)
    ports:
      - "2222:2222"   # host 2222 -> container sshd; point a Cloudflare tunnel here for remote access
    # Do NOT mount over /home/dev/venv or all of /home/dev — it would erase the
    # pre-built venv.
volumes:
  ds-uv-cache:
  ds-claude:
  ds-gh:
  ds-ssh-host:
  ds-zed-server:
  ds-local-share:
